# Platform store, backed by the cuber-ai Key Vault (cuber-ai/200-shared).
# Authenticates as the ESO service account through Workload Identity (cuber-ai/300-cluster/external-secrets.tf).
# It can read the whole vault, so only platform namespaces may use it. Tenants get their own namespaced
# SecretStore and identity (charts/tenant-namespace externalSecrets, cuber-ai/300-cluster/secret-consumers.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  conditions:
    - namespaces:
        - cert-manager # internal CA (platform/cert-manager/internal-ca-secret.yaml)
  provider:
    azurekv:
      authType: WorkloadIdentity
      # cuber-ai/300-cluster: terraform output -json external_secrets | jq -r .key_vault_url
      vaultUrl: "<external_secrets.key_vault_url>"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
